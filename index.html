<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAVE Bus Tracking - Vale do Ave</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container py-4">
        <!-- Header -->
        <header class="mb-4">
            <h1 class="text-center">MAVE Bus Tracking</h1>
            <p class="text-center text-muted">Horários em tempo real - Vale do Ave</p>
        </header>

        <!-- Main View: Stop List -->
        <div id="stopListView">
            <!-- Search bar placeholder -->
            <div class="mb-3">
                <input type="text" id="searchInput" class="form-control" placeholder="Procurar paragem...">
            </div>

            <!-- Recent stops placeholder -->
            <div id="recentStops" class="mb-3"></div>

            <!-- Stop list placeholder -->
            <div id="stopList"></div>
        </div>

        <!-- Stop Detail View (hidden initially) -->
        <div id="stopDetailView" style="display: none;">
            <!-- Back button -->
            <button id="backButton" class="btn btn-secondary mb-3">← Voltar</button>

            <!-- Stop info placeholder -->
            <div id="stopInfo"></div>

            <!-- Routes list placeholder -->
            <div id="routesList"></div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App Scripts -->
    <script src="js/api.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
