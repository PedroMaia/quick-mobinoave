<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acompanhamento de autocarros MAVE em tempo real na região do Vale do Ave">
    <meta name="theme-color" content="#0d6efd">
    <title>MAVE Bus Tracking - Vale do Ave</title>

    <!-- Installable app (PWA) -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon.svg">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
    <div class="container py-4">
        <!-- Header -->
        <header class="mb-4">
            <h1 class="text-center">
                <span class="bus-icon">🚌</span> MAVE Bus Tracking
            </h1>
            <p class="text-center text-muted">Horários em tempo real - Vale do Ave</p>
        </header>

        <!-- Connection Error Alert (hidden by default) -->
        <div id="connectionError" class="alert alert-danger alert-dismissible fade" role="alert" style="display: none;">
            <strong>Erro de conexão</strong>
            <p class="mb-0 small">Não foi possível conectar ao servidor. Verifique sua conexão à internet.</p>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
        </div>

        <!-- Fired arrival alert (filled by Alerts) -->
        <div id="alertBanner" class="alert-banner-wrap" style="display: none;"></div>

        <!-- Armed arrival alerts, shown on every view (filled by Alerts) -->
        <div id="alertsBar" class="mb-3" style="display: none;"></div>

        <!-- Main tabs -->
        <ul class="nav nav-pills nav-fill mb-3 main-tabs" id="mainTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button type="button" class="nav-link active" data-tab="stops" role="tab" aria-selected="true">🚏 Paragens</button>
            </li>
            <li class="nav-item" role="presentation">
                <button type="button" class="nav-link" data-tab="nearby" role="tab" aria-selected="false">📍 Perto de mim</button>
            </li>
        </ul>

        <!-- Main View: Stop List -->
        <div id="stopListView">
            <!-- Search bar and bus line filter -->
            <div class="row g-2 mb-3">
                <div class="col-12 col-sm-8">
                    <input type="text" id="searchInput" class="form-control" placeholder="Procurar paragem ou nº do autocarro...">
                </div>
                <div class="col-12 col-sm-4">
                    <select id="routeFilter" class="form-select" aria-label="Filtrar por linha">
                        <option value="">Todas as linhas</option>
                    </select>
                </div>
            </div>

            <!-- Favorite stops placeholder -->
            <div id="favoriteStops" class="mb-3"></div>

            <!-- Active route filter header -->
            <div id="routeFilterInfo" class="mb-3"></div>

            <!-- Stop list placeholder -->
            <div id="stopList"></div>
        </div>

        <!-- Nearby View: stops within a radius of the user (hidden initially) -->
        <div id="nearbyView" style="display: none;">
            <!-- Radius slider -->
            <div class="nearby-panel mb-3">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <label for="radiusSlider" class="nearby-label mb-0">
                        <span class="nearby-dot"></span> Raio de alcance
                    </label>
                    <span id="radiusValue" class="radius-value">2 km</span>
                </div>
                <input type="range" class="form-range" id="radiusSlider" min="200" max="5000" step="100" value="2000">
                <div class="d-flex justify-content-between small text-muted">
                    <span>200 m (~3 min a pé)</span>
                    <span>5 km (~60 min a pé)</span>
                </div>
            </div>

            <!-- Map (shown once Leaflet has loaded) -->
            <div id="nearbyMap" class="nearby-map mb-3" style="display: none;"></div>

            <!-- Hint / warning line (filled by Nearby.setNotice) -->
            <div id="nearbyNotice" class="nearby-notice mb-2"></div>

            <!-- Result count and list -->
            <div id="nearbyCount" class="nearby-count mb-2"></div>
            <div id="nearbyList"></div>

            <!-- Footer -->
            <div class="nearby-footer d-flex flex-wrap justify-content-between align-items-center gap-2 mt-3">
                <small id="nearbyUpdated" class="text-muted"></small>
                <div class="d-flex flex-wrap gap-2">
                    <button id="pickOnMapBtn" type="button" class="btn btn-sm btn-outline-secondary">🗺️ Escolher no mapa</button>
                    <button id="relocateBtn" type="button" class="btn btn-sm btn-outline-primary">📍 Atualizar localização</button>
                </div>
            </div>
        </div>

        <!-- Stop Detail View (hidden initially) -->
        <div id="stopDetailView" style="display: none;">
            <!-- Back button -->
            <button id="backButton" class="btn btn-secondary mb-3">← Voltar</button>

            <!-- Stop info placeholder -->
            <div id="stopInfo"></div>

            <!-- Live bus map (filled by BusMap) -->
            <div id="busMapCard"></div>

            <!-- Routes list placeholder -->
            <div id="routesList"></div>
        </div>
    </div>

    <!-- Arrival alert dialog -->
    <div class="modal fade" id="alertModal" tabindex="-1" aria-labelledby="alertModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="alertModalTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-2 small text-muted">Paragem: <strong id="alertModalStop"></strong></p>
                    <div id="alertMinutes" class="alert-minutes d-flex flex-wrap gap-2 mb-3" role="group" aria-label="Minutos antes da chegada"></div>
                    <p id="alertModalHint" class="small text-muted mb-0"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" id="alertRemoveBtn" class="btn btn-outline-danger me-auto">Remover</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="alertSaveBtn" class="btn btn-primary">Ativar alerta</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App Scripts -->
    <!-- Bump ?v= whenever a JS/CSS file changes so GitHub Pages visitors don't get stale cached files -->
    <script src="js/api.js?v=3"></script>
    <script src="js/storage.js?v=3"></script>
    <script src="js/geo.js?v=6"></script>
    <script src="js/nearby.js?v=5"></script>
    <script src="js/busmap.js?v=1"></script>
    <script src="js/alerts.js?v=1"></script>
    <script src="js/app.js?v=3"></script>
</body>
</html>
